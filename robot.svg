<!-- Colors mirror the site color tokens in global.css: 1d1c1a is the text color, b4532a the accent, fbfaf7 the background, d9946b a lighter accent tint -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- antenna -->
  <line x1="32" y1="7" x2="32" y2="14" stroke="#1d1c1a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="3" fill="#d9946b"/>
  <!-- head -->
  <rect x="16" y="14" width="32" height="22" rx="8" fill="#b4532a"/>
  <rect x="20" y="18" width="24" height="13" rx="5" fill="#1d1c1a"/>
  <circle cx="27" cy="24.5" r="3" fill="#fbfaf7"/>
  <circle cx="37" cy="24.5" r="3" fill="#fbfaf7"/>
  <!-- neck -->
  <rect x="29" y="35" width="6" height="4" fill="#1d1c1a"/>
  <!-- arms -->
  <rect x="15" y="40" width="5" height="9" rx="2.5" fill="#1d1c1a"/>
  <rect x="44" y="40" width="5" height="9" rx="2.5" fill="#1d1c1a"/>
  <!-- body -->
  <rect x="22" y="38" width="20" height="14" rx="4" fill="#b4532a"/>
  <circle cx="32" cy="45" r="2.5" fill="#d9946b"/>
  <!-- legs -->
  <rect x="25" y="52" width="5" height="7" rx="2" fill="#1d1c1a"/>
  <rect x="34" y="52" width="5" height="7" rx="2" fill="#1d1c1a"/>
</svg>